name: Build Winfile for Windows on ARM

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  build-arm64:
    runs-on: windows-2022

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
    
    
    - name: Install Missing Windows 10 SDK (18362)
      if: false 
      #doest work
      run: choco install windows-sdk-10-version-1903-all --no-progress -y

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Navigate to Workspace
      run: cd src

    - name: Restore NuGet Packages
      run: nuget restore winfile.sln
      # Note: Early winfile might not use NuGet, but included for modern compatibility layers

    - name: Build for Windows on ARM (ARM64)
      continue-on-error: true
      run: msbuild winfile.sln /p:Configuration=Release /p:Platform=ARM64  /p:WindowsTargetPlatformVersion=10.0

    # Creates a custom named zip archive using the matrix architecture and run number
    - name: Zip Build Artifacts
      run: |
        Get-ChildItem -Recurse | Select-Object -ExpandProperty FullName
        Compress-Archive -Path .\ -DestinationPath build\woa64-build-b${{ github.run_number }}.zip
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: woa64-artifact-b${{ github.run_number }}
        path: build/woa64-build-b${{ github.run_number }}.zip
        
    - name: Upload Build Artifacts
      if: false
      uses: actions/upload-artifact@v4
      with:
        name: ms-winfiles-run-${{ github.run_number }}-wo64
        path: |
          **/bin/Release/
          **/bin/ARM64/Release/
        retention-days: 5
